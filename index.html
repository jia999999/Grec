<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F9FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1B2D" media="(prefers-color-scheme: dark)">
<title>Grec au quotidien</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=Commissioner:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F9FB;--surface:#FFFFFF;--ink:#14213D;--muted:#5B6779;--line:#D9E1EA;
  --blue:#1D4E89;--on-blue:#FFFFFF;--blue-soft:#E4EDF7;--olive:#5E6E33;
  --right:#3E7C4F;--right-soft:#E6F1E8;--wrong:#B23A48;--wrong-soft:#F8E6E8;
  --s1:#6da7ec;--s2:#2a78d6;--s3:#1c5cab;--s4:#0d366b; /* dégradé validé : plus = plus foncé */
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0F1B2D;--surface:#16263D;--ink:#E8EEF5;--muted:#9AA9BD;--line:#253650;
    --blue:#8DB3E2;--on-blue:#0F1B2D;--blue-soft:#1C3352;--olive:#B3C27F;
    --right:#7FC08F;--right-soft:#173826;--wrong:#E58A95;--wrong-soft:#3A1C24;
    --s1:#1c5cab;--s2:#2a78d6;--s3:#5598e7;--s4:#9ec5f4; /* en sombre : plus = plus clair */
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Commissioner",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:17px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
.gr{font-family:"GFS Didot","Noto Serif","Georgia",serif;font-weight:400}
main{max-width:580px;margin:0 auto;padding:20px 20px 64px}
h1,h2,h3{margin:0;font-weight:600;line-height:1.25}
h2{font-size:22px}
h3{font-size:17px}
p{margin:.4em 0}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:var(--on-blue);border:0;border-radius:999px;padding:13px 24px;font-weight:600;min-height:48px}
.btn:disabled{opacity:.4}
.btn.ghost{background:transparent;color:var(--blue);box-shadow:inset 0 0 0 1.5px var(--blue)}
.btn.wide{width:100%}
.link{background:none;border:0;padding:6px 0;color:var(--blue);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.actions{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:16px}

/* Accueil */
.hello{padding:28px 0 20px}
.hello .word{font-size:clamp(56px,17vw,88px);line-height:1;letter-spacing:-.01em}
.hello .sub{color:var(--muted);margin-top:8px}
.streak{margin-top:16px;font-weight:500}
.streak b{color:var(--olive);font-weight:600}
.lead{font-size:19px}
.today{background:var(--blue-soft);border-radius:24px;padding:24px;margin:8px 0 28px}
.today .kicker{color:var(--blue);font-weight:600;margin:0 0 4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0;border-top:1px solid var(--line)}
.row p{color:var(--muted);margin:2px 0 0}
.lvl{margin-top:30px}
.lvl h3{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.lvl h3 span{font-weight:400;color:var(--muted);font-size:15px}
.path{list-style:none;margin:8px 0 0;padding:0}
.path li{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);color:var(--muted);min-height:52px}
.path .num{width:40px;font-size:20px;flex:none}
.path .pt{flex:1}
.path .st{font-size:14px;text-align:right}
.path li.is-done{color:var(--ink)}
.path li.is-done .num{color:var(--olive)}
.path li.is-cur{color:var(--ink);font-weight:600}
.path li.is-cur .num{color:var(--blue)}
.tag{font-size:14px;font-weight:600;color:var(--blue)}
.tag.weak{color:var(--wrong)}
.tag.ok{color:var(--olive)}
footer{margin-top:36px;color:var(--muted);font-size:15px;display:grid;gap:6px}
footer .link{color:var(--muted);font-size:15px;justify-self:start}

/* Séance */
.bar{display:flex;align-items:center;gap:14px;margin:4px 0 6px}
.x{background:none;border:0;font-size:22px;width:44px;height:44px;border-radius:50%;color:var(--muted);flex:none}
.track{flex:1;height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.track span{display:block;height:100%;background:var(--blue);border-radius:8px;transition:width .3s ease}
.clock{font-size:14px;color:var(--muted);min-width:48px;text-align:right;font-variant-numeric:tabular-nums}
.step{margin:0 0 26px 58px;font-size:14px;font-weight:600;color:var(--olive)}
.ask{color:var(--muted);margin:0 0 10px}
.big{font-size:clamp(46px,14vw,80px);line-height:1.1;margin:6px 0 10px;overflow-wrap:anywhere}
.tr-big{font-size:20px;color:var(--muted);font-style:italic;margin:0}
.fr-big{font-size:clamp(24px,7vw,32px);font-weight:500;line-height:1.25;margin:8px 0 14px}
.sent{font-size:clamp(26px,7.5vw,34px);line-height:1.3;margin:6px 0 12px}
.gq{font-size:clamp(26px,7.5vw,34px);line-height:1.35;margin:6px 0 4px}
.blank{display:inline-block;min-width:2.4em;border-bottom:3px solid var(--blue);color:transparent}
.hint{color:var(--muted);margin:2px 0 0}
.qtext{font-size:21px;font-weight:500;line-height:1.35}
.say{display:inline-flex;align-items:center;gap:8px;background:none;border:1.5px solid var(--line);border-radius:999px;padding:9px 16px;color:var(--blue);font-weight:500;margin-top:6px}
.say svg{width:20px;height:20px}
.play{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:28px;border-radius:24px;border:0;background:var(--blue-soft);color:var(--blue);font-weight:600;font-size:18px;margin:8px 0 6px}
.play svg{width:28px;height:28px}
.foot{margin-top:32px}
.opts{display:grid;gap:10px;margin-top:24px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font-size:18px;min-height:56px;transition:background-color .15s,border-color .15s}
.opt .gr{font-size:24px}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);font-size:13px;display:grid;place-items:center;color:var(--muted)}
.opt em{color:var(--muted)}
.opt:disabled{opacity:1}
.opt.right{border-color:var(--right);background:var(--right-soft)}
.opt.wrong{border-color:var(--wrong);background:var(--wrong-soft)}

/* Images */
.pic,.po,.fbp{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-weight:400}
.pic{font-size:104px;line-height:1.15;margin:4px 0 8px}
.pic.sm{font-size:64px;margin:0 0 4px}
.pic.n,.pic.sm.n{font-size:40px;line-height:1.3;letter-spacing:4px;white-space:nowrap}
.po{font-size:56px;line-height:1.1}
.po .cnt{display:block;font-size:22px;line-height:1.4;letter-spacing:1px;white-space:nowrap}
.fbp{font-size:24px;vertical-align:-3px}
.opts.grid4{grid-template-columns:1fr 1fr}
.opts.grid4 .opt{position:relative;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-height:124px;padding:38px 10px 16px}
.opts.grid4 .opt .k{position:absolute;top:8px;left:8px}

/* Écrire en grec */
.wr{display:block;width:100%;margin-top:12px;padding:10px 14px;font-size:32px;line-height:1.2;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:14px;caret-color:var(--blue)}
.wr:focus{outline:none;border-color:var(--blue)}
.wr.ok{border-color:var(--right)}
.wr.ko{border-color:var(--wrong)}
.wtools{display:flex;flex-wrap:wrap;align-items:center;gap:4px 20px;margin-top:6px;min-height:40px}
.wtools .hint i{color:var(--ink)}
.kb{display:grid;gap:7px;margin-top:12px;-webkit-user-select:none;user-select:none}
.kr{display:flex;gap:5px;justify-content:center}
.kk{flex:1 1 0;max-width:44px;min-height:48px;padding:0;font-size:23px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:0 1px 0 var(--line);touch-action:manipulation}
.kk:active{background:var(--blue-soft)}
.kk.back{flex:1.6 1 0;max-width:70px;font-size:20px}
.kk.acc,.kk.space{max-width:none;font-family:inherit;font-size:16px;color:var(--muted)}
.kk.acc{flex:1.3 1 0}
.kk.space{flex:3 1 0}
.kk.on{color:var(--blue);background:var(--blue-soft);border-color:var(--blue)}
.yours{margin:8px 0 0;color:var(--muted)}

/* Statistiques */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 8px}
.tile-s{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.tile-s p{margin:0}
.tl{font-size:14px;color:var(--muted)}
.tv{font-size:28px;font-weight:600;line-height:1.2;margin:4px 0 2px!important}
.ts{font-size:13px;color:var(--muted);line-height:1.35}
.st{padding:24px 0 6px;border-top:1px solid var(--line);margin-top:22px}
.st h2{font-size:20px}
.st>.muted{margin:2px 0 14px;font-size:15px}
.cal{overflow-x:auto}
.cm,.cg{display:grid;grid-template-columns:18px repeat(12,1fr);gap:3px}
.cm span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:visible;height:16px}
.cw{display:grid;grid-template-rows:repeat(7,1fr);gap:3px}
.cw.lab span{font-size:11px;color:var(--muted);display:flex;align-items:center}
.cd{display:block;width:100%;aspect-ratio:1;min-width:12px;border:0;padding:0;border-radius:4px;background:var(--line)}
.cd.fut{background:transparent}
.cd.b1{background:var(--s1)}.cd.b2{background:var(--s2)}.cd.b3{background:var(--s3)}.cd.b4{background:var(--s4)}
.cd.now{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}
.cleg{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:10px;font-size:12px;color:var(--muted)}
.cleg .cd{width:14px;min-width:14px}
.cleg span:first-child{margin-right:4px}.cleg span:last-child{margin-left:4px}
.readout{font-size:15px;color:var(--muted);margin:10px 0 0;min-height:1.5em}
.readout b{color:var(--ink)}
.lc{display:block;width:100%;height:auto;touch-action:pan-y}
.lc .gl{stroke:var(--line);stroke-width:1}
.lc .ax{font-size:11px;fill:var(--muted);font-family:inherit}
.lc .ll{fill:none;stroke:var(--blue);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.lc .la{fill:var(--blue);opacity:.1}
.lc .ld{fill:var(--blue);stroke:var(--bg);stroke-width:2}
.lc .lv{font-size:13px;font-weight:600;fill:var(--ink);font-family:inherit}
.lc .xh{stroke:var(--muted);stroke-width:1}
.seg{display:flex;gap:2px;height:8px;margin:4px 0 6px}
.seg span{border-radius:999px;min-width:4px}
.m0{background:var(--s1)}.m1{background:var(--s2)}.m2{background:var(--s3)}.m3{background:var(--s4)}
.mlist,.wlist{list-style:none;margin:0;padding:0}
.mlist li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.mlist .sw{flex:none;width:12px;height:12px;border-radius:4px}
.mlist .mn{flex:1;display:flex;flex-direction:column;line-height:1.3}
.mlist .mn span{font-size:14px;color:var(--muted)}
.mlist .mc{font-weight:600;font-size:18px}
.wlist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.wbtn{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0;font-size:22px;color:var(--blue)}
.wfr{flex:1;min-width:120px;color:var(--muted)}
.wfr b{color:var(--ink)}
.wn{font-size:14px;color:var(--muted);white-space:nowrap}
.sub{margin:22px 0 4px;font-size:17px}

/* Entraînement libre */
.ph{font-size:18px;margin:26px 0 10px}
.opts.tight{margin-top:0;gap:8px}
.opt.pick{font-size:17px;line-height:1.35;padding:12px 16px}
.opt.pick .muted{font-size:15px}
.opt.sel,.chip.sel{border-color:var(--blue);background:var(--blue-soft);box-shadow:inset 0 0 0 1px var(--blue)}
.sel-in{width:100%;min-height:52px;padding:12px 14px;font:inherit;font-size:17px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;min-height:56px}
.chip span{font-size:13px;color:var(--muted)}
.fb{margin-top:22px;padding:18px;border-radius:18px;display:flex;flex-direction:column;gap:14px}
.fb.ok{background:var(--right-soft)}
.fb.ko{background:var(--wrong-soft)}
.fb strong{font-size:18px}
.fb.ok strong{color:var(--right)}
.fb.ko strong{color:var(--wrong)}
.fb-word{margin-top:4px}
.fb-word .gr{font-size:22px}
.fb-word .tr{color:var(--muted);font-style:italic}

.sec{padding-top:40px}
.sec h2{font-size:32px}
.sec p{font-size:18px;color:var(--muted);max-width:30em}
.sec .btn{margin-top:28px}

.gram h2{font-size:26px;margin-bottom:8px}
.conj{border-collapse:collapse;width:100%;margin:16px 0}
.conj tr{cursor:pointer}
.conj td{padding:10px 8px 10px 0;border-bottom:1px solid var(--line);vertical-align:baseline}
.conj td.gr{font-size:22px;white-space:nowrap;padding-right:18px}
.conj td.fr{color:var(--muted)}
.note{background:var(--blue-soft);border-radius:14px;padding:14px 16px;margin:16px 0;font-size:16px}

.built{min-height:72px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:12px 0;border-bottom:2px solid var(--line);margin-top:18px}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.wt{font-family:"GFS Didot","Noto Serif",Georgia,serif;font-size:23px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px 14px;min-height:48px}
.wt.ghost{visibility:hidden}
.built.ok{border-color:var(--right)}
.built.ko{border-color:var(--wrong)}

.dlg{display:grid;gap:14px;margin:18px 0}
.ln .sp{font-size:14px;color:var(--olive);font-weight:600;margin:0}
.ln .lg{display:block;text-align:left;background:none;border:0;padding:2px 0;font-size:24px;line-height:1.3}
.ln .lf{color:var(--muted);margin:2px 0 0}

.res{text-align:center;padding-top:44px}
.res .big{color:var(--blue)}
.res .score{font-size:56px;font-weight:600;line-height:1;margin:8px 0}
.res p{max-width:30em;margin-left:auto;margin-right:auto}
.res .actions{justify-content:center;margin-top:28px}

/* Fiches */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:16px 0 28px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px;text-align:left}
.tile .L{font-size:30px;line-height:1.1}
.tile .nm{font-size:14px;font-style:italic;color:var(--muted)}
.tile .snd{font-size:14px;font-weight:500;line-height:1.3}
details{border-bottom:1px solid var(--line);padding:4px 0}
summary{cursor:pointer;padding:12px 0;font-weight:500}
.page-title{font-size:26px;margin:4px 0 6px}

/* Sauvegarde et transfert */
.sync{padding:22px 0;border-top:1px solid var(--line)}
.sync:first-of-type{margin-top:18px}
.sync h2{font-size:20px;margin-bottom:4px}
textarea.code{display:block;width:100%;min-height:96px;margin-top:14px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:16px/1.4 ui-monospace,Menlo,monospace;word-break:break-all;resize:vertical}
textarea.code:focus{border-color:var(--blue);outline:none}
.msg{margin:14px 0 0;padding:12px 14px;border-radius:12px;font-size:16px}
.msg.ok{background:var(--right-soft);color:var(--ink)}
.msg.ko{background:var(--wrong-soft);color:var(--ink)}
.howto{margin:8px 0 0;padding-left:22px}
.howto li{margin:8px 0}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.other{margin-top:18px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* =====================================================================
   CONTENU — pour ajouter une unité, copiez un bloc { t, w, g, ex, s, d }
   w  : mots      [grec, transcription, français]
   g  : fiche de grammaire { t:titre, p:texte, tb:[[grec, français]], n:note }
   ex : exercices [phrase avec ___, traduction, bonne réponse, mauvaises…]
   s  : phrases à reconstruire [grec, français]
   d  : dialogue [personnage, grec, français]
   ===================================================================== */
const ALPHA = [
  ["Α α","álfa","a","άλφα"],["Β β","víta","v","βήτα"],["Γ γ","gháma","gh doux, y devant e et i","γάμμα"],
  ["Δ δ","dhélta","dh, comme « this » en anglais","δέλτα"],["Ε ε","épsilon","é","έψιλον"],["Ζ ζ","zíta","z","ζήτα"],
  ["Η η","íta","i","ήτα"],["Θ θ","thíta","th, comme « think » en anglais","θήτα"],["Ι ι","yóta","i","γιώτα"],
  ["Κ κ","kápa","k","κάππα"],["Λ λ","lámdha","l","λάμδα"],["Μ μ","mi","m","μι"],
  ["Ν ν","ni","n","νι"],["Ξ ξ","ksi","ks","ξι"],["Ο ο","ómikron","o","όμικρον"],
  ["Π π","pi","p","πι"],["Ρ ρ","ro","r roulé","ρο"],["Σ σ ς","sígma","s (ς en fin de mot)","σίγμα"],
  ["Τ τ","taf","t","ταυ"],["Υ υ","ípsilon","i","ύψιλον"],["Φ φ","fi","f","φι"],
  ["Χ χ","khi","kh, comme la jota espagnole","χι"],["Ψ ψ","psi","ps","ψι"],["Ω ω","oméga","o","ωμέγα"]
];
const COMBOS = [["ου","ou","ουρανός"],["αι","é","είμαι"],["ει, οι","i","εκεί"],["αυ","av ou af","αύριο"],["ευ","év ou éf","ευρώ"],["μπ","b","μπλε"],["ντ","d","πέντε"],["γκ, γγ","g","συγγνώμη"]];

const LEVELS = [
{name:"L’alphabet", tag:"Découverte", units:[
  {t:"Les lettres de Α à Μ", alpha:[0,12],
   w:[["ταξί","taksí","taxi"],["καφές","kafés","café"],["μετρό","metró","métro"],["κιθάρα","kithára","guitare"],["θέατρο","théatro","théâtre"],["δελφίνι","dhelfíni","dauphin"],["ζέβρα","zévra","zèbre"],["γάλα","ghála","lait"]],
   g:{t:"Lire l’accent",p:"Tous les mots grecs de plus d’une syllabe portent un accent écrit (΄). Il indique la syllabe à appuyer : καφές se dit ka-FÈS. Trois lettres se lisent « i » : η, ι et υ. Le γ devant e ou i se lit comme un « y ».",
      tb:[["καφές","ka-FÈS"],["θέατρο","THÉ-a-tro"],["γάλα","GHA-la"],["γεια","ya"]],n:"Touchez une ligne pour l’écouter."},

  u.items=[...u.letters,...u.words];
  UNITS.push(u);
}));
const UBY=Object.fromEntries(UNITS.map(u=>[u.id,u]));

function today(o=0){const d=new Date();d.setDate(d.getDate()+o);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parseDay(s){const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function markActive(){const t=today();if(S.last===t)return;S.streak=(S.last===today(-1))?S.streak+1:1;S.last=t;S.best=Math.max(S.best||0,S.streak)}
function currentStreak(){return(S.last===today()||S.last===today(-1))?S.streak:0}
function dueItems(){const t=today();return Object.entries(S.cards).filter(([,c])=>c.due<=t).map(([id])=>ITEMS[id]).filter(Boolean)}
function grade(it,ok){const c=S.cards[it.id]||{box:1};c.box=ok?Math.min(c.box+1,INTERVALS.length-1):1;if(!ok)c.miss=(c.miss||0)+1;c.due=today(INTERVALS[c.box]);S.cards[it.id]=c}
/* Entraînement libre : un mot à réviser aujourd’hui compte comme sa révision ;
   pour les autres, une erreur le fait revenir dès demain, une bonne réponse ne change rien. */
function practiceGrade(it,ok){
  const c=S.cards[it.id];if(!c)return;
  if(c.due<=today()){grade(it,ok);return}
  if(!ok){c.box=1;c.miss=(c.miss||0)+1;c.due=today(1)}
}
function nextTask(){
  for(let li=0;li<LEVELS.length;li++){
    const us=levelUnits(li);
    const nd=us.find(u=>!S.units[u.id]?.done);if(nd)return{type:"unit",uid:nd.id};
    if(S.exams[li]?.passed)continue;
    const wk=us.find(u=>S.units[u.id].weak);if(wk)return{type:"unit",uid:wk.id,redo:true,li};
    return{type:"exam",li};
  }
  return null;
}

/* iPhone : en mode silencieux, la voix est coupée sur le haut-parleur
   (mais pas dans les écouteurs). On demande une session audio de type
   « lecture », comme une app de musique, et on joue un court silence
   au premier toucher pour que iOS bascule le son sur le haut-parleur. */
const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
let silentEl=null;
function silentWav(){
  const n=800,b=new ArrayBuffer(44+n*2),v=new DataView(b);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,"RIFF");v.setUint32(4,36+n*2,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,8000,true);v.setUint32(28,16000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,n*2,true);
  return URL.createObjectURL(new Blob([b],{type:"audio/wav"}));
}
function audioUnlock(){
  try{if(navigator.audioSession&&navigator.audioSession.type!=="playback")navigator.audioSession.type="playback"}catch(e){}
  if(!IOS)return;
  try{
    if(!silentEl){silentEl=new Audio(silentWav());silentEl.setAttribute("playsinline","");silentEl.preload="auto"}
    silentEl.currentTime=0;const p=silentEl.play();if(p&&p.catch)p.catch(()=>{});
  }catch(e){}
}
document.addEventListener("pointerdown",audioUnlock,{capture:true,once:true});
document.addEventListener("touchend",audioUnlock,{capture:true,once:true});

function wq(w,type,step,extra={}){

  const key=type==="read"?"tr":(type==="gr2fr"||type==="sound")?"fr":type==="gr2img"?"pk":"gr";

  else if(type==="fr2gr"){ask="Comment dit-on en grec ?";prompt=`<div class="fr-big">${w.fr}</div>`;opts=choice(G(w.gr),others.map(o=>G(o.gr)))}

function gq(e,step,extra={}){

function sq(s,pool,step,extra={}){

// comparaison tolérante : majuscules, σ/ς, ponctuation, article (ο, η, το…) ; accents optionnels
function gnorm(s,accents){
  s=(s||"").toLowerCase().normalize("NFD");
  if(!accents)s=s.replace(/[̀-ͯ]/g,"");
  return s.normalize("NFC").replace(/ς/g,"σ").replace(/[;;.,!?·…«»"'’()]/g," ").replace(/\s+/g," ").trim().replace(/^(ο|η|το|οι|τα) /,"");
}
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function gradeWrite(a,e){
  if(!a.trim())return"ko";
  if(gnorm(a,true)===gnorm(e,true))return"ok";
  if(gnorm(a)===gnorm(e))return"accent";
  if(gnorm(e).length>=5&&lev(gnorm(a),gnorm(e))<=1)return"typo";
  return"ko";
}
function checkWrite(){

  s.res=gradeWrite(s.val,s.item.gr);s.checked=s.res!=="ko";
  record(s,s.checked);
  if(!s.checked&&!s.noRetry)insertRetry(s.remake());
  speak(s.say);render();
}

function typeKey(k){
  const s=cur();if(s.k!=="write"||s.checked!=null)return;

function typeAccent(){

function warmupFor(uid){
  const u=UBY[uid];const own=new Set(u?u.items.map(i=>i.id):[]);
  let w=shuffle(dueItems().filter(i=>!own.has(i.id))).slice(0,12);
  const weak=UNITS.filter(x=>S.units[x.id]?.weak&&x.id!==uid).flatMap(x=>x.items).filter(i=>!w.includes(i));
  return w.concat(shuffle(weak).slice(0,Math.max(0,14-w.length)).slice(0,4));
}

function buildUnit(u){
  const sc=[];const B={bilan:true,noRetry:true};
  const warm=warmupFor(u.id);
  if(warm.length){
    sc.push(sec("Échauffement","Échauffement",`${warm.length} mot${warm.length>1?"s":""} déjà vu${warm.length>1?"s":""}, pour réveiller la mémoire.`));
    warm.forEach(w=>sc.push(wq(w,pick(typesFor(w)),"Échauffement",{srs:true})));
  }
  if(u.alpha){
    sc.push(sec("Lettres","Nouvelles lettres",`${u.letters.length} lettres à découvrir. Écoutez chacune et observez bien sa forme.`));
    u.letters.forEach((w,i)=>sc.push({k:"teach",step:"Lettres",w,i,n:u.letters.length}));
    const q=[];u.letters.forEach((l,i)=>{q.push(wq(l,"sound","Lettres"));if(i%2===0)q.push(wq(l,"letter","Lettres"))});
    sc.push(...spread(q));
    sc.push({k:"gram",step:"Règles",g:u.g});u.ex.forEach(e=>sc.push(gq(e,"Règles",{unit:u.id})));
    sc.push(sec("Lecture","À vous de lire","Ces mots ressemblent beaucoup au français. Essayez de les lire avant d’écouter."));
    u.words.forEach((w,i)=>sc.push({k:"teach",step:"Lecture",w,i,n:u.words.length}));
    const r=[];u.words.forEach(w=>{r.push(wq(w,"read","Lecture"));r.push(wq(w,"gr2fr","Lecture"))});
    sc.push(...spread(r));
    sc.push(sec("Bilan","Bilan de l’unité","8 questions sans seconde chance. Votre score décide de la suite."));
    sc.push(...shuffle([...shuffle(u.letters).slice(0,5).map(l=>wq(l,pick(["sound","letter"]),"Bilan",B)),...shuffle(u.words).slice(0,3).map(w=>wq(w,"read","Bilan",B))]));
    return sc;
  }
  sc.push(sec("Vocabulaire","Nouveaux mots",`${u.words.length} mots à découvrir. Répétez chacun à voix haute après l’avoir écouté.`));
  u.words.forEach((w,i)=>sc.push({k:"teach",step:"Vocabulaire",w,i,n:u.words.length}));
  const q=[];u.words.forEach((w,i)=>{
    const p=canPic(w);
    q.push(wq(w,p&&i%2===0?"img2gr":"gr2fr","Vocabulaire"));
    q.push(wq(w,p&&i%2?"gr2img":(elVoice&&i%2)?"listen":"fr2gr","Vocabulaire"));
  });
  sc.push(...spread(q));
  // pour finir le vocabulaire : écrire 3 mots courts, avec indice de prononciation
  sc.push(...shuffle(u.words.filter(w=>w.gr.length<=14)).slice(0,3).map(w=>writeQ(w,"Vocabulaire")));
  sc.push({k:"gram",step:"Grammaire",g:u.g});
  shuffle(u.ex).forEach(e=>sc.push(gq(e,"Grammaire",{unit:u.id})));
  sc.push(sec("Phrases","Construire des phrases","Remettez les mots dans l’ordre pour traduire chaque phrase."));
  u.s.forEach(s=>sc.push(oq([s[0],s[1],u.id],"Phrases")));
  sc.push({k:"dlg",step:"Dialogue",lines:u.d,show:false});
  const dl=u.d.map(l=>[l[1],l[2],u.id]);
  shuffle(dl).slice(0,3).forEach(l=>sc.push(sq(l,dl,"Dialogue")));
  sc.push(sec("Bilan","Bilan de l’unité","8 questions sans seconde chance. Votre score décide de la suite."));
  const ls=levelSentences(u.li);
  sc.push(...shuffle([
    ...shuffle(u.words).slice(0,4).map(w=>wq(w,pick(["gr2fr","fr2gr"]),"Bilan",B)),
    ...shuffle(u.ex).slice(0,2).map(e=>gq(e,"Bilan",{...B,unit:u.id})),
    ...shuffle(u.s).slice(0,2).map(s=>sq([s[0],s[1],u.id],ls,"Bilan",B))
  ]));
  return sc;
}

function buildExam(li){
  const B={bilan:true,noRetry:true};let q;
  if(li===0){
    q=[...shuffle(ALL_LETTERS).slice(0,10).map(l=>wq(l,pick(["sound","letter"]),"Examen",B)),
       ...shuffle(levelWords(0)).slice(0,6).map(w=>wq(w,"read","Examen",B)),
       ...shuffle(levelExercises(0)).slice(0,4).map(x=>gq(x.e,"Examen",{...B,unit:x.uid}))];
  }else{
    const ls=levelSentences(li);
    q=[...shuffle(levelWords(li)).slice(0,10).map(w=>wq(w,pick(["gr2fr","fr2gr"]),"Examen",B)),
       ...shuffle(levelExercises(li)).slice(0,6).map(x=>gq(x.e,"Examen",{...B,unit:x.uid})),
       ...shuffle(ls).slice(0,4).map(s=>sq(s,ls,"Examen",B))];
  }
  return[sec("Examen",`Examen : ${LEVELS[li].name}`,`20 questions sur tout le niveau, sans seconde chance. Il faut 75 % pour le valider.`),...shuffle(q)];
}

function placementStage(li){
  const P={noRetry:true,idk:true,place:true};const st="Examen de niveau";
  if(li===0)return shuffle(levelWords(0)).slice(0,5).map(w=>wq(w,"read",st,P));
  const ls=levelSentences(li);
  return shuffle([...shuffle(levelWords(li)).slice(0,4).map(w=>wq(w,"gr2fr",st,P)),
    ...shuffle(levelExercises(li)).slice(0,3).map(x=>gq(x.e,st,P)),
    sq(pick(ls),ls,st,P)]);
}

function buildReview(){
  const items=shuffle(dueItems()).slice(0,20);
  return[sec("Révision","Révision",`${items.length} mot${items.length>1?"s":""} à revoir aujourd’hui.`),...items.map(w=>wq(w,pick(typesFor(w)),"Révision",{srs:true}))];
}

let V="home",SES=null,RES=null;
function newSession(mode,sc,extra={}){
  SES=Object.assign({mode,sc,pos:0,start:Date.now(),stats:{c:0,t:0},bilan:{c:0,t:0},err:{}},extra);
  SES.steps=[...new Set(sc.map(s=>s.step))];
  go("session");
}
function startUnit(uid){newSession("unit",buildUnit(UBY[uid]),{unit:UBY[uid]})}
function startExam(li){newSession("exam",buildExam(li),{li})}
function startReview(){if(dueItems().length)newSession("review",buildReview())}

/* ---------- Entraînement libre ---------- */
const PRACTICE_DEFAULT={mode:"mix",scope:"all",len:20};
function practicePool(scope){
  const us=UNITS.filter(u=>S.units[u.id]?.done&&(scope==="all"||(scope[0]==="L"?String(u.li)===scope.slice(1):u.id===scope)));
  return{us,
    items:us.flatMap(u=>u.items).filter(i=>S.cards[i.id]),
    ex:us.flatMap(u=>u.ex.map(e=>({e,uid:u.id}))),
    sent:us.flatMap(u=>[...(u.s||[]).map(s=>[s[0],s[1],u.id]),...(u.d||[]).map(l=>[l[1],l[2],u.id])])};
}
const weakItems=items=>items.filter(i=>(S.cards[i.id]?.box||1)<=2);
function byWeakness(items){ // les mots les moins sûrs d’abord, avec un peu de hasard
  return items.map(i=>{const c=S.cards[i.id]||{box:1};return[c.box-Math.min(c.miss||0,3)*.5+Math.random()*2.5,i]}).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
}
function wordQs(list,n,types,X,passes=2){ // un mot peut revenir une 2e fois, sous une autre forme
  const order=byWeakness(list),q=[];
  for(let pass=0;pass<passes&&q.length<n;pass++)
    for(const w of order){
      if(q.length>=n)break;
      const ts=types(w),k=pass===0?Math.floor(Math.random()*ts.length):(q.find(x=>x.item===w)?.typeIdx+1||0);
      const s=wq(w,ts[k%ts.length],"Entraînement",X);s.typeIdx=k%ts.length;q.push(s);
    }
  return q;
}
function buildPractice(cfg){
  const P=practicePool(cfg.scope),X={practice:true},n=cfg.len,st="Entraînement";
  const anyType=w=>typesFor(w),listen=()=>["listen"];
  const gram=k=>shuffle(P.ex).slice(0,k).map(x=>gq(x.e,st,{...X,unit:x.uid}));
  const sents=k=>{
    const sp=P.sent.filter(s=>s[0].split(" ").length<=8);
    return shuffle(P.sent).slice(0,k).map((s,i)=>i%2&&sp.includes(s)?oq(s,st):sq(s,P.sent,st,X));
  };
  let q;
  if(cfg.mode==="words")q=wordQs(P.items,n,anyType,X);
  else if(cfg.mode==="weak")q=wordQs(weakItems(P.items),n,anyType,X);
  else if(cfg.mode==="listen")q=wordQs(P.items.filter(i=>!i.letter),n,listen,X,1);
  else if(cfg.mode==="write")q=wordQs(P.items.filter(i=>!i.letter),n,()=>["write"],X,1);
  else if(cfg.mode==="img")q=wordQs(P.items.filter(i=>!i.letter&&canPic(i)),n,()=>["img2gr","gr2img"],X,2);
  else if(cfg.mode==="gram"){
    const g=gram(Math.ceil(n/2));q=[...g,...sents(n-g.length)];
    if(q.length<n)q.push(...gram(n-q.length).filter(x=>!g.some(y=>y.prompt===x.prompt)));
  }else{
    const g=gram(Math.round(n/4)),s=P.sent.length>=4?sents(Math.round(n/4)):[];
    q=[...g,...s,...wordQs(P.items,n-g.length-s.length,anyType,X)];
  }
  return spread(q).slice(0,n);
}
function startPractice(){
  const cfg=Object.assign({},PRACTICE_DEFAULT,S.pp||{});
  const sc=buildPractice(cfg);if(!sc.length)return go("practice");
  newSession("practice",sc,{cfg});
}
function startPlacement(){
  newSession("placement",[sec("Examen de niveau","Examen de niveau","Les questions deviennent de plus en plus difficiles et l’examen s’arrête dès qu’il a trouvé votre niveau. Choisissez « Je ne sais pas » plutôt que de deviner."),...placementStage(0)],{stageLi:0,stage:{c:0,t:0}});
}
const cur=()=>SES.sc[SES.pos];

function insertRetry(r){
  const c=cur();let k=SES.pos+1;while(k<SES.sc.length&&SES.sc[k].step===c.step)k++;
  r.retry=true;SES.sc.splice(Math.min(SES.pos+4,k),0,r);
}
function record(s,ok){
  if(s.retry)return;
  SES.stats.t++;if(ok)SES.stats.c++;
  if(s.bilan){SES.bilan.t++;if(ok)SES.bilan.c++}
  if(s.place){SES.stage.t++;if(ok)SES.stage.c++}
  if(!ok){const uid=s.unit||(s.item&&s.item.unit);if(uid)SES.err[uid]=(SES.err[uid]||0)+1}
  if(s.srs&&s.item)grade(s.item,ok);
  if(s.practice&&s.item)practiceGrade(s.item,ok);
}
function answer(i){
  const s=cur();if(s.k!=="mcq"||s.answered!=null||!s.opts[i])return;
  s.answered=i;const ok=s.opts[i].ok;record(s,ok);
  if(!ok&&!s.noRetry&&s.remake)insertRetry(s.remake());
  if(s.say)speak(s.say);
  render();
}
function checkOrder(){
  const s=cur();if(s.checked!=null||s.picked.length!==s.words.length)return;
  s.checked=s.picked.map(i=>s.words[i]).join(" ")===s.words.join(" ");
  record(s,s.checked);
  if(!s.checked)insertRetry(s.remake());
  speak(s.s[0]);render();
}
function advance(){
  if(canSpeak)speechSynthesis.cancel();
  SES.pos++;
  if(SES.pos>=SES.sc.length){SES.mode==="placement"?evalStage():finish();return}
  render();window.scrollTo(0,0);
}
function closeSession(countsAsDay){
  const m=Math.max(1,Math.round((Date.now()-SES.start)/60000));
  S.minutes[today()]=(S.minutes[today()]||0)+m;S.total=(S.total||0)+m;
  if(countsAsDay)S.dayDone=today();
  markActive();save();return m;
}
function finish(){
  const m=closeSession(SES.mode==="unit"||SES.mode==="exam");
  if(SES.mode==="unit"){
    const u=SES.unit;const sc=SES.bilan.t?SES.bilan.c/SES.bilan.t:1;
    S.units[u.id]={done:true,score:sc,weak:sc<.7,date:today()};
    u.items.forEach(it=>{if(!S.cards[it.id])S.cards[it.id]={box:1,due:today(1)}});
    save();
    const msg=sc>=.85?"Excellent ! Vous êtes prêt pour la suite."
      :sc>=.7?"Bien joué. Les mots ratés reviendront dans vos révisions."
      :"Cette unité est marquée « à consolider ». Ses mots reviendront dans vos échauffements, et elle vous sera reproposée avant l’examen du niveau.";
    const t=nextTask();
    const after=t&&t.type==="exam"?`<p class="muted">Toutes les unités du niveau sont faites : l’examen « ${LEVELS[t.li].name} » vous attend demain.</p>`:"";
    RES={title:"Μπράβο!",score:pct(sc),lines:[`Bilan de l’unité ${u.id}, en ${m} min.`,msg],extra:after};
  }else if(SES.mode==="exam"){
    const li=SES.li,sc=SES.bilan.c/SES.bilan.t,pass=sc>=.75,prev=S.exams[li]||{};
    S.exams[li]={passed:pass||!!prev.passed,best:Math.max(sc,prev.best||0),date:today(),tries:(prev.tries||0)+1};
    let extra="";
    if(pass){
      RES={title:"Μπράβο!",score:pct(sc),lines:[`Niveau « ${LEVELS[li].name} » validé.`,li<LEVELS.length-1?`Le niveau suivant, « ${LEVELS[li+1].name} », commence demain.`:"Vous avez terminé tout le parcours actuel. Continuez les révisions pour garder vos acquis."]};
    }else{
      const errs=Object.entries(SES.err).sort((a,b)=>b[1]-a[1]);
      let weak=errs.filter(([,n])=>n>=2).map(([id])=>id);
      if(!weak.length&&errs.length)weak=[errs[0][0]];
      weak.forEach(id=>{if(S.units[id])S.units[id].weak=true});
      extra=weak.length?`<p>À consolider : ${weak.map(id=>`unité ${id} (${UBY[id].t})`).join(", ")}. Ces unités vous seront reproposées, puis vous pourrez retenter l’examen.</p>`:"";
      RES={title:"Presque",score:pct(sc),lines:["Il faut 75 % pour valider le niveau."]};
    }
    RES.extra=extra;save();
  }else if(SES.mode==="practice"){
    const{c,t}=SES.stats;
    RES={title:"Μπράβο!",score:t?pct(c/t):"",again:true,lines:[`${t} question${t>1?"s":""} en ${m} min.`,
      t-c?"Les mots ratés reviendront dès demain dans vos révisions.":"Aucune erreur, bravo !"]};
  }else{
    RES={title:"Μπράβο!",score:SES.stats.t?pct(SES.stats.c/SES.stats.t):"",lines:[`Révision terminée en ${m} min.`,"Les mots réussis reviendront plus tard, ceux ratés dès demain."]};
  }
  go("result");
}
function evalStage(){
  const li=SES.stageLi,{c}=SES.stage,pass=c>=(li===0?4:6);
  if(pass&&li<LEVELS.length-1){
    SES.stageLi=li+1;SES.stage={c:0,t:0};SES.sc.push(...placementStage(li+1));render();window.scrollTo(0,0);return;
  }
  finishPlacement(pass?LEVELS.length-1:li,pass&&li===LEVELS.length-1);
}
function placeAt(start){
  for(let li=0;li<start;li++){
    levelUnits(li).forEach(u=>{
      if(!S.units[u.id]?.done)S.units[u.id]={done:true,score:null,weak:false,viaTest:true,date:today()};
      u.items.forEach(it=>{if(!S.cards[it.id])S.cards[it.id]={box:3,due:today(2+Math.floor(Math.random()*8))}});
    });
    if(!S.exams[li]?.passed)S.exams[li]={passed:true,viaTest:true,date:today()};
  }
  S.placed=true;
}
function finishPlacement(start,all){
  placeAt(start);closeSession(false);
  const L=LEVELS[start];
  RES={title:"Votre niveau",score:start===0?"Débutant complet":`${L.name} (${L.tag})`,lines:[
    start===0?"Vous commencez par l’alphabet : c’est la base de tout le reste."
      :all?"Vous maîtrisez déjà l’essentiel du parcours. Vous commencez au dernier niveau pour consolider."
      :`Vous commencez au niveau « ${L.name} ». Les mots des niveaux précédents reviendront de temps en temps en révision.`]};
  go("result");
}

      ${done?fb:`<div class="wtools">${s.hint?`<span class="hint">Prononciation : <i>${w.tr}</i></span>`:`<button class="link" data-a="whint">Indice</button>`}<button class="link" data-a="widk">Je ne sais pas</button><button class="link" data-a="wnative">${s.native?"Clavier de l’app":"Clavier du téléphone"}</button></div>

const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const dayDiff=(a,b)=>Math.round((parseDay(b)-parseDay(a))/864e5);
const frDate=(k,o={day:"numeric",month:"long"})=>parseDay(k).toLocaleDateString("fr-FR",o);
function monday(off=0){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+off*7);return d}
function bestStreak(){
  let best=0,run=0,prev=null;
  Object.keys(S.minutes||{}).filter(k=>S.minutes[k]>0).sort().forEach(k=>{run=prev&&dayDiff(prev,k)===1?run+1:1;best=Math.max(best,run);prev=k});
  return Math.max(best,S.best||0,currentStreak());
}
function weekMinutes(off){let m=0;for(let i=0;i<7;i++)m+=S.minutes[today(off*7-i)]||0;return m} // 7 jours glissants : 0 = les 7 derniers jours, -1 = les 7 d’avant
const fmtDur=m=>m<60?`${m} min`:`${Math.floor(m/60)} h ${String(m%60).padStart(2,"0")}`;
const bucket=m=>!m?0:m<10?1:m<20?2:m<30?3:4;
const MEM=[["Nouveaux","vus récemment ou ratés, reviennent demain",c=>c.box<=1],["En cours","reviennent tous les 2 à 4 jours",c=>c.box===2||c.box===3],["Solides","reviennent tous les 8 jours",c=>c.box===4],["Maîtrisés","reviennent tous les 16 à 32 jours",c=>c.box>=5]];
let LINE=null; // points du graphique, pour l’affichage au toucher

function wordsSeries(){
  const ev={};
  UNITS.forEach(u=>{const st=S.units[u.id];if(!st?.done||!st.date)return;const n=u.items.filter(i=>S.cards[i.id]).length;if(n)ev[st.date]=(ev[st.date]||0)+n});
  const ds=Object.keys(ev).sort();if(!ds.length)return[];
  const out=[];let cum=0;const span=dayDiff(ds[0],today());
  for(let i=0;i<=span;i++){const d=parseDay(ds[0]);d.setDate(d.getDate()+i);const k=ymd(d);cum+=ev[k]||0;out.push([k,cum])}
  return out;
}
function lineChart(pts){
  const W=350,H=170,L=34,R=40,T=14,B=26,max=Math.max(10,Math.ceil(pts[pts.length-1][1]/(pts[pts.length-1][1]>100?50:10))*(pts[pts.length-1][1]>100?50:10));
  const x=i=>L+(pts.length===1?0:i*(W-L-R)/(pts.length-1)),y=v=>T+(H-T-B)*(1-v/max);
  const path=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join("");
  const area=`${path}L${x(pts.length-1).toFixed(1)},${y(0)}L${x(0)},${y(0)}Z`;
  const grid=[0,max/2,max].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="gl"/><text x="${L-6}" y="${y(v)+4}" class="ax" text-anchor="end">${v}</text>`).join("");
  const last=pts[pts.length-1],lx=x(pts.length-1),ly=y(last[1]);
  LINE={pts,x,y,L,R,W};
  return`<svg id="wl" viewBox="0 0 ${W} ${H}" class="lc" role="img" aria-label="Mots et lettres appris : ${pts[0][1]} le ${frDate(pts[0][0])}, ${last[1]} aujourd’hui">
    ${grid}<path d="${area}" class="la"/><path d="${path}" class="ll"/>
    <text x="${L}" y="${H-6}" class="ax">${frDate(pts[0][0],{day:"numeric",month:"short"})}</text><text x="${W-R}" y="${H-6}" class="ax" text-anchor="end">aujourd’hui</text>
    <line id="wlx" class="xh" y1="${T}" y2="${y(0)}" x1="${lx}" x2="${lx}" visibility="hidden"/>
    <circle cx="${lx}" cy="${ly}" r="4.5" class="ld"/><text x="${lx+8}" y="${ly+5}" class="lv">${last[1]}</text>
    <circle id="wldot" r="4.5" class="ld" visibility="hidden"/>
    <rect x="${L}" y="0" width="${W-L-R}" height="${H-B}" fill="transparent"/></svg>`;
}
function lineHover(e){
  const svg=document.getElementById("wl");if(!svg||!LINE)return;
  const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)*LINE.W/r.width,n=LINE.pts.length;
  const i=Math.max(0,Math.min(n-1,Math.round((px-LINE.L)/((LINE.W-LINE.L-LINE.R)/Math.max(1,n-1)))));
  const p=LINE.pts[i],X=LINE.x(i),Y=LINE.y(p[1]);
  const xh=document.getElementById("wlx"),dot=document.getElementById("wldot"),out=document.getElementById("wlout");
  xh.setAttribute("x1",X);xh.setAttribute("x2",X);xh.setAttribute("visibility","visible");
  dot.setAttribute("cx",X);dot.setAttribute("cy",Y);dot.setAttribute("visibility","visible");
  out.innerHTML=`<b>${p[1]}</b> mots et lettres au ${p[0]===today()?"jour d’aujourd’hui":frDate(p[0])}`;
}

    <ul class="mlist">${MEM.map((m,i)=>`<li><span class="sw m${i}" aria-hidden="true"></span><span class="mn"><b>${m[0]}</b><span>${m[1]}</span></span><span class="mc">${counts[i]}</span></li>`).join("")}</ul>`;

  // mots appris dans le temps
  const pts=wordsSeries();LINE=null;

    :`<p class="muted">Le graphique apparaîtra après quelques jours d’étude.</p>`;

  const weakU=UNITS.filter(u=>typeof S.units[u.id]?.score==="number"&&S.units[u.id].score<.85).sort((a,b)=>S.units[a.id].score-S.units[b.id].score).slice(0,3);
  const weak=`${missed.length?`<ul class="wlist">${missed.map(([id,c])=>{const w=ITEMS[id];return`<li><button class="wbtn" data-a="say" data-v="${w.say||w.gr}" aria-label="Écouter ${w.tr}">${PIC[w.gr]?`<span class="fbp">${PIC[w.gr]}</span>`:""}<span class="gr" lang="el">${w.gr}</span></button><span class="wfr">${w.fr}</span><span class="wn">${c.miss} erreur${c.miss>1?"s":""}</span></li>`}).join("")}</ul>`

    ${weakU.length?`<h3 class="sub">Unités les moins réussies</h3><ul class="wlist">${weakU.map(u=>`<li><span class="wfr"><b>${u.id}</b> ${u.t}</span><span class="wn">${pct(S.units[u.id].score)}</span><button class="link" data-a="unit" data-v="${u.id}">Refaire</button></li>`).join("")}</ul>`:""}

  <section class="st"><h2>Mots appris</h2><p class="muted">Mots et lettres, depuis le début</p>${growth}</section>
  <section class="st"><h2>Solidité de la mémoire</h2><p class="muted">Plus un mot est solide, moins il revient souvent en révision.</p>${memory}</section>
  <section class="st"><h2>Points faibles</h2>${weak}</section>`;

/* =====================================================================
   SAUVEGARDE ET TRANSFERT
   Chaque navigateur (Chrome, Safari, app de l’écran d’accueil) garde
   sa propre copie. Un code texte permet de passer de l’un à l’autre.
   ===================================================================== */
let SYNC={};
const hasProgress=st=>Object.keys(st.cards||{}).length>0||Object.values(st.units||{}).some(u=>u&&u.done);
function summary(st){
  if(!hasProgress(st))return"aucune progression";
  const w=Object.keys(st.cards||{}).length,u=Object.values(st.units||{}).filter(x=>x&&x.done).length,m=st.total||0;
  return`${w} mots et lettres, ${u} unité${u>1?"s":""} terminée${u>1?"s":""}, ${m} min d’étude`;
}
function encodeState(st){
  const bytes=new TextEncoder().encode(JSON.stringify(st));let bin="";
  for(let i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);
  return"GREC1-"+btoa(bin);
}
function decodeState(txt){
  txt=(txt||"").trim();let json;
  if(txt.startsWith("{"))json=txt;
  else{
    const m=txt.replace(/\s+/g,"").match(/GREC1-([A-Za-z0-9+/=]+)/);if(!m)return null;
    const bin=atob(m[1]);json=new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)));
  }
  const o=JSON.parse(json);
  return o&&typeof o==="object"&&o.cards&&typeof o.cards==="object"?o:null;
}
function renderSync(){
  const last=S.lastExport?`Dernière sauvegarde le ${parseDay(S.lastExport).toLocaleDateString("fr-FR",{day:"numeric",month:"long"})}.`:"";
  const msg=w=>SYNC.where===w&&SYNC.msg?`<p class="msg ${SYNC.kind}" role="status">${SYNC.msg}</p>`:"";
  const esc=t=>(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
  app.innerHTML=`
  <div class="bar"><button class="x" data-a="home" aria-label="Retour à l’accueil">✕</button></div>
  <h1 class="page-title">Sauvegarde et transfert</h1>
  <p class="muted">Chrome, Safari et l’app de l’écran d’accueil gardent chacun leur propre progression, sans la partager. Un code permet de la déplacer de l’un à l’autre, ou de la mettre de côté.</p>
  <section class="sync">
    <h2>Envoyer la progression de cet écran</h2>
    <p>Ici : ${summary(S)}. ${last}</p>
    <div class="actions"><button class="btn" data-a="export" ${hasProgress(S)?"":"disabled"}>Copier mon code</button>${hasProgress(S)?`<button class="link" data-a="download">Télécharger un fichier de sauvegarde</button>`:""}</div>
    ${SYNC.code?`<textarea class="code" readonly aria-label="Votre code de progression">${SYNC.code}</textarea>`:""}
    ${msg("out")}
  </section>
  <section class="sync">
    <h2>Recevoir une progression</h2>
    <p>Collez un code copié ailleurs. La progression de cet écran sera remplacée par celle du code.</p>
    <textarea class="code" id="paste" placeholder="Appui long ici, puis « Coller »" aria-label="Code à importer" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">${esc(SYNC.paste)}</textarea>
    <div class="actions"><button class="btn" data-a="import">Importer</button><button class="link" data-a="pickfile">Choisir un fichier</button></div>
    <input type="file" id="file" class="vh" accept=".json,.txt,application/json,text/plain" tabindex="-1" aria-hidden="true">
    ${msg("in")}
  </section>
  <section class="sync">
    <h2>Sur iPhone, de Chrome vers l’écran d’accueil</h2>
    <ol class="howto">
      <li>Ouvrez l’app dans Chrome, puis « Sauvegarde et transfert », et touchez « Copier mon code ».</li>
      <li>Ouvrez l’app depuis l’écran d’accueil, puis « Importer » (ou « Sauvegarde et transfert ») et touchez « Importer » : le code est collé automatiquement.</li>
      <li>Ensuite, utilisez seulement l’app de l’écran d’accueil pour que votre progression reste au même endroit.</li>
    </ol>
  </section>`;
}
async function doExport(){
  S.lastExport=today();save();
  const code=encodeState(S);let ok=false;
  try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(code);ok=true}}catch(e){}
  SYNC={where:"out",code,kind:ok?"ok":"ko",msg:ok
    ?"Code copié. Ouvrez l’app là où vous voulez retrouver votre progression, puis touchez « Importer »."
    :"La copie automatique n’a pas fonctionné. Touchez le code ci-dessus, choisissez « Tout sélectionner », puis « Copier »."};
  render();
  if(!ok){const t=app.querySelector("textarea[readonly]");if(t){t.focus();t.select()}}
}
function doDownload(){
  S.lastExport=today();save();
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));
  a.download=`grec-progression-${today()}.json`;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},60000);
  SYNC={where:"out",kind:"ok",msg:"Fichier téléchargé. Gardez-le dans Fichiers : vous pourrez le réimporter avec « Choisir un fichier »."};
  render();
}
async function doImport(txt){
  if(txt==null){
    txt=(document.getElementById("paste")||{}).value||"";
    if(!txt.trim()&&navigator.clipboard&&navigator.clipboard.readText){try{txt=await navigator.clipboard.readText()}catch(e){}}
  }
  let data=null;try{data=decodeState(txt)}catch(e){}
  if(!data){
    SYNC={where:"in",kind:"ko",paste:txt,msg:txt.trim()
      ?"Ce code n’est pas reconnu. Vérifiez qu’il a été copié en entier, du début à la fin."
      :"Aucun code trouvé. Faites un appui long dans la zone ci-dessus, choisissez « Coller », puis touchez « Importer »."};
    render();return;
  }
  if(hasProgress(S)&&!confirm(`Remplacer la progression de cet écran ?\n\nDans le code : ${summary(data)}.\nIci : ${summary(S)}.`))return;
  S=Object.assign(fresh(),data);
  if(hasProgress(S))S.placed=true;
  save();SYNC={};
  RES={title:"Καλώς ήρθες!",score:"",lines:[`Progression importée : ${summary(S)}.`,"Vous pouvez continuer ici, là où vous en étiez."]};
  go("result");
}

/* =====================================================================
   INTERACTIONS
   ===================================================================== */
const ACTIONS={
  placement:startPlacement,
  replace:()=>{if(confirm("Refaire l’examen de niveau ? Votre progression actuelle est conservée."))startPlacement()},
  beginner:()=>{S.placed=true;save();go("home")},
  today:()=>{const t=nextTask();if(!t)return;t.type==="unit"?startUnit(t.uid):startExam(t.li)},
  unit:v=>startUnit(v),
  exam:v=>startExam(+v),
  review:startReview,
  notes:()=>go("notes"),
  home:()=>{if(canSpeak)speechSynthesis.cancel();go("home")},
  quit:()=>{if(confirm("Quitter la séance ? Ce que vous avez fait dans cette séance ne sera pas compté.")){if(canSpeak)speechSynthesis.cancel();SES=null;go("home")}},
  cont:advance,
  ans:v=>answer(+v),
  pick:v=>{const s=cur();if(s.checked==null&&!s.picked.includes(+v)){s.picked.push(+v);render()}},
  unpick:v=>{const s=cur();if(s.checked==null){s.picked.splice(+v,1);render()}},
  check:checkOrder,
  say:v=>speak(v),
  sayall:()=>speakAll(cur().lines.map(l=>l[1])),
  toggle:()=>{const s=cur();s.show=!s.show;render()},
  key:v=>typeKey(v),
  kback:()=>{const s=cur();if(s.k==="write"&&s.checked==null){s.val=s.val.slice(0,-1);s.pend=false;syncWr()}},
  kacc:typeAccent,
  wcheck:checkWrite,
  widk:()=>{const s=cur();if(s.k==="write"){s.val="";checkWrite()}},
  whint:()=>{cur().hint=true;render()},
  wnative:()=>{const s=cur();s.native=!s.native;render()},
  stats:()=>go("stats"),
  calday:v=>{const o=document.getElementById("calout"),m=S.minutes[v]||0;if(o)o.innerHTML=`<b>${frDate(v,{weekday:"long",day:"numeric",month:"long"})}</b> : ${m?m+" min d’étude":"pas d’étude ce jour-là"}`},
  pweak:()=>{S.pp=Object.assign({},PRACTICE_DEFAULT,S.pp,{mode:"weak",scope:"all"});save();startPractice()},
  practice:()=>go("practice"),
  pmode:v=>{S.pp=Object.assign({},PRACTICE_DEFAULT,S.pp,{mode:v});save();render()},
  plen:v=>{S.pp=Object.assign({},PRACTICE_DEFAULT,S.pp,{len:+v});save();render()},
  pstart:startPractice,
  sync:()=>{SYNC={};go("sync")},
  export:doExport,
  download:doDownload,
  import:()=>doImport(),
  pickfile:()=>{const f=document.getElementById("file");if(f)f.click()},
  reset:()=>{if(confirm("Effacer toute votre progression ? Cette action est définitive.")){S=fresh();save();go("home")}}
};
app.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b||b.disabled)return;const f=ACTIONS[b.dataset.a];if(f)f(b.dataset.v)});
app.addEventListener("input",e=>{if(e.target.id==="wr"&&V==="session"){const s=cur();if(s.k==="write"&&s.checked==null)s.val=e.target.value}});
app.addEventListener("change",e=>{
  if(e.target.id==="pscope"){S.pp=Object.assign({},PRACTICE_DEFAULT,S.pp,{scope:e.target.value});save();render();return}
  if(e.target.id!=="file"||!e.target.files||!e.target.files[0])return;
  e.target.files[0].text().then(t=>doImport(t)).catch(()=>{SYNC={where:"in",kind:"ko",msg:"Impossible de lire ce fichier."};render()});
});
document.addEventListener("keydown",e=>{
  if(V!=="session"||e.metaKey||e.ctrlKey||e.altKey)return;
  const s=cur(),onBtn=e.target.tagName==="BUTTON";
  if(s.k==="mcq"&&s.answered==null&&/^[1-5]$/.test(e.key)){answer(+e.key-1);e.preventDefault();return}
  if(e.key==="Enter"&&!onBtn){
    if(s.k==="order"&&s.checked==null)checkOrder();
    else if(s.k==="write"&&s.checked==null)checkWrite();
    else if(s.k!=="mcq"||s.answered!=null)advance();
    e.preventDefault();
  }
});
setInterval(()=>{const el=document.getElementById("clock");if(el&&SES)el.textContent=fmtMin(Date.now()-SES.start)},15000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&V==="home")render()});
render();
</script>
</body>
